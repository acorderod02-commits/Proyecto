<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | PlayCheck</title>
    <!-- Se reutiliza index.css (navbar, footer, base) y login.css añade lo propio del login -->
    <link rel="stylesheet" href="../CSS/index.css" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <link rel="icon" type="image/x-icon" href="../imagenes/Logo_Color.png" />
  </head>
  <body class="login-page">
    <!-- Navbar (misma que el index, sin buscador) -->
    <nav class="navbar">
      <a href="index.html" class="nav-brand brand-link">
        <div class="logo-placeholder">
          <img
            src="../imagenes/Logo_Blanco_Negro.png"
            alt=""
            height="50"
            width="50"
            class="logo"
          />
        </div>
        <span class="brand-name">PlayCheck</span>
      </a>

      <div class="login-container">
        <a href="index.html">
          <button type="button" class="login-btn">Volver al inicio</button>
        </a>
      </div>
    </nav>

    <!-- Zona central con el formulario -->
    <main class="login-main">
      <section class="login-card">
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">
          Accede para guardar tus juegos y publicar tus análisis.
        </p>

        <form class="login-form" action="#" method="post">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="tucorreo@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Mostrar contraseña"
              >
                Mostrar
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" name="remember" />
              Recordarme
            </label>
            <a href="#" class="link">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="submit-btn">Iniciar sesión</button>
        </form>

        <p class="register-text">
          ¿Aún no tienes cuenta?
          <a href="registro.html" class="link">Crear cuenta</a>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 PlayCheck. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
